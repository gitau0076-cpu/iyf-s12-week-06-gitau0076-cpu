<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Checker</h1>
        
        <div class="search-box">
            <!-- Coordinates for popular testing locations -->
            <select id="city-selector">
                <option value="-1.2921,36.8219">Nairobi, Kenya</option>
                <option value="40.7128,-74.0060">New York, USA</option>
                <option value="51.5074,-0.1278">London, UK</option>
                <option value="-33.8688,151.2093">Sydney, Australia</option>
                <option value="35.6762,139.6503">Tokyo, Japan</option>
            </select>
            <button id="fetch-btn">Get Weather</button>
        </div>

        <div id="weather-card" class="weather-card hidden">
            <h2 id="location-name">City Weather</h2>
            <div class="temp-display">
                <span id="temperature">--</span>°C
            </div>
            <div class="details-grid">
                <div class="detail-item">
                    <span class="label">Wind Speed:</span>
                    <span id="windspeed" class="value">--</span> km/h
                </div>
                <div class="detail-item">
                    <span class="label">Humidity:</span>
                    <span id="humidity" class="value">--</span> %
                </div>
            </div>
        </div>
        
        <div id="error-message" class="error hidden"></div>
    </div>
    <script src="asycn-practice.js"></script>
</body>
</html>
