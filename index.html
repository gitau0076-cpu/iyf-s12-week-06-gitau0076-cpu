<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Weather Dashboard</h1>
        
        <form id="search-form">
            <input 
                type="search" 
                id="city-input" 
                placeholder="Enter city name..."
                required
            >
            <button type="submit">Search</button>
            <button type="button" id="location-button" aria-label="Use my current location">&#x1F4CD;</button>
        </form>
        <button type="button" id="unit-toggle" class="unit-toggle">Switch to &deg;F</button>
        
        <div id="loading" class="hidden">
            Loading...
        </div>
        
        <div id="error" class="hidden error">
        </div>
        
        <div id="weather-display" class="hidden">
            <div class="weather-main">
                <h2 id="city-name"></h2>
                <img id="weather-icon" src="" alt="Weather icon">
                <p id="temperature"></p>
                <p id="description"></p>
            </div>
            <section class="forecast-wrap" aria-labelledby="forecast-title">
                <h3 id="forecast-title">5-day forecast</h3>
                <div id="forecast" class="forecast hidden"></div>
            </section>
            
            <div class="weather-details">
                <div class="detail">
                    <span>Feels Like</span>
                    <span id="feels-like"></span>
                </div>
                <div class="detail">
                    <span>Humidity</span>
                    <span id="humidity"></span>
                </div>
                <div class="detail">
                    <span>Wind</span>
                    <span id="wind"></span>
                </div>
                <div class="detail">
                    <span>Pressure</span>
                    <span id="pressure"></span>
                </div>
            </div>
        </div>
        
        <div id="recent-searches">
            <h3>Recent Searches</h3>
            <ul id="search-history"></ul>
        </div>

        <section class="api-explorer" aria-labelledby="api-explorer-title">
            <h2 id="api-explorer-title">Posts API</h2>
            <p>Fetch posts, filter the results, or add a post with a POST request.</p>

            <label for="post-search">Search posts</label>
            <input id="post-search" type="search" placeholder="Filter by title or text">

            <form id="post-form">
                <label for="post-title">New post title</label>
                <input id="post-title" type="text" maxlength="100" required>
                <label for="post-body">Post text</label>
                <textarea id="post-body" rows="3" required></textarea>
                <button id="post-submit" type="submit">Create post</button>
            </form>

            <p id="posts-loading" class="hidden" role="status">Loading posts...</p>
            <p id="posts-error" class="hidden error" role="alert"></p>
            <p id="post-status" class="hidden" role="status"></p>
            <div id="posts-list" class="posts-list" aria-live="polite"></div>
        </section>
    </main>
    
    <script src="config.js"></script>   <!-- defines API_KEY; git-ignored -->
    <script src="app.js"></script>
</body>
</html>
