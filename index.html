<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Weather Dashboard</h1>
        
        <form id="search-form">
            <input 
                type="search" 
                id="city-input" 
                placeholder="Enter city name..."
                required
            >
            <button type="submit">Search</button>
            <button type="button" id="location-button" aria-label="Use my current location">&#x1F4CD;</button>
        </form>
        <button type="button" id="unit-toggle" class="unit-toggle">Switch to &deg;F</button>
        
        <div id="loading" class="hidden">
            Loading...
        </div>
        
        <div id="error" class="hidden error">
        </div>
        
        <div id="weather-display" class="hidden">
            <div class="weather-main">
                <h2 id="city-name"></h2>
                <img id="weather-icon" src="" alt="Weather icon">
                <p id="temperature"></p>
                <p id="description"></p>
            </div>
            <section class="forecast-wrap" aria-labelledby="forecast-title">
                <h3 id="forecast-title">5-day forecast</h3>
                <div id="forecast" class="forecast hidden"></div>
            </section>
            
            <div class="weather-details">
                <div class="detail">
                    <span>Feels Like</span>
                    <span id="feels-like"></span>
                </div>
                <div class="detail">
                    <span>Humidity</span>
                    <span id="humidity"></span>
                </div>
                <div class="detail">
                    <span>Wind</span>
                    <span id="wind"></span>
                </div>
                <div class="detail">
                    <span>Pressure</span>
                    <span id="pressure"></span>
                </div>
            </div>
        </div>
        
        <div id="recent-searches">
            <h3>Recent Searches</h3>
            <ul id="search-history"></ul>
        </div>
    </main>
    
    <script src="config.js"></script>   <!-- defines API_KEY; git-ignored -->
    <script src="app.js"></script>
</body>
</html>
